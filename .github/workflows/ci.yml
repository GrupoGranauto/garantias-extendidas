name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos (backend y frontend)
        run: npm run typecheck
      - name: Pruebas del backend
        run: npm test
      - name: Compila el frontend
        run: npm run build --workspace frontend
